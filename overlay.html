<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Twitch Overlay</title>
  <meta name="viewport" content="width=1920, height=1080">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="stage">
    <!-- Handcam-Rahmen: die Mitte ist transparent, Kamera in OBS darunter legen -->
    <div id="handcam" class="handcam">
      <div class="handcam-frame"></div>
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div class="handcam-label"><span class="dot"></span><span id="handcam-label-text">HANDCAM</span></div>
    </div>

    <!-- Chat -->
    <div id="chat" class="chat">
      <div class="chat-header">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 3h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-7l-5 4v-4H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/></svg>
        <span>CHAT</span>
        <span id="chat-status" class="chat-status" title="Verbindung"></span>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
    </div>

    <!-- Follow-Alert -->
    <div id="alert" class="alert" aria-live="polite">
      <div class="alert-burst"></div>
      <div class="alert-card">
        <div class="alert-icon">
          <svg viewBox="0 0 24 24" width="56" height="56" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4h2c.7-1.3 2.2-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>
        </div>
        <div class="alert-text">
          <div class="alert-title">NEUER FOLLOWER</div>
          <div id="alert-name" class="alert-name"></div>
          <div id="alert-sub" class="alert-sub"></div>
        </div>
      </div>
    </div>

    <div id="debug" class="debug"></div>
  </div>

  <script src="config.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
